services:
  # ==========================================
  # FocusPledge Backend Web Service (API)
  # ==========================================
  - type: web
    name: focuspledge-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Enter your MongoDB Atlas connection string in the Render Dashboard

  # ==========================================
  # FocusPledge Frontend Static Web App
  # ==========================================
  - type: web
    name: focuspledge-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: focuspledge-api
          property: host
